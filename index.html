<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>SIRIUS Inspector · Aseguradora del Sur</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#14263f;--muted:#5b6b80;--line:#dde3ea;--soft:#f4f7fa;--p:#0B5CAD;--sky:#00A6E6;--pd:#0B2E59;--ok:#1f7a5c;--okbg:#e7f4ee;--warn:#9a6400;--warnbg:#fdf3dc;--bad:#b42318;--badbg:#fdecea}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#e9eef4;font:400 15.5px/1.45 Mulish,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #7fb0f5;outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0b2e5918}
.hd{padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;background:#101010;color:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--sky)}.hd img{height:44px;width:auto;display:block}.hd .u{text-align:right;font-size:12px;line-height:1.3}.hd .u b{font-size:13px}
.net{font-size:12.5px;font-weight:800;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.net.on{background:#e7f4ee;color:var(--ok)}.net.off{background:#fdf3dc;color:var(--warn)}.net button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;font-size:12px;padding:0}
.scr{flex:1;overflow:auto;padding:12px 16px 22px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:#fff}.nav button{border:0;background:#fff;padding:8px 0 10px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative}.nav button.on{color:var(--p)}.nav i{display:block;font-style:normal;font-size:19px}.nav .b{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
h1{font-size:22px;margin:2px 0 6px;line-height:1.2}h2{font-size:15.5px;margin:16px 0 6px}.mut{color:var(--muted)}.sm{font-size:13px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 0}.card.hi{border-color:#bcd7f2;background:#f3f8fe}.card.warn{border-color:#f0d48a;background:#fffaf0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:var(--p);color:#fff;margin-top:9px;min-height:48px;text-align:center;text-decoration:none}.btn:disabled{opacity:.45}.btn2{background:#fff;color:var(--p);border:1.5px solid var(--p)}.btng{background:var(--ok)}.btnr{background:#fff;color:var(--bad);border:1.5px solid #f1b7b0}.btn3{background:none;color:var(--muted);border:0;font-weight:700;padding:6px 0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.act{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:10px 4px;font-weight:800;font-size:12.5px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none}.act i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#eef5fd}.act.go i{background:#e7f4ee}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;background:var(--ok);color:#fff;font-weight:900;font-size:17px;padding:16px;margin-top:6px}.big i{font-style:normal;font-size:24px}
.vis{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff;width:100%;text-align:left}.vis .n{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:900}.vis b{display:block}.vis small{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:900;white-space:nowrap}.c-p{background:var(--warnbg);color:var(--warn)}.c-r{background:#e8eef6;color:#3d5a80}.c-a{background:var(--okbg);color:var(--ok)}.c-x{background:var(--badbg);color:var(--bad)}
#mapa{height:210px;border-radius:14px;border:1px solid var(--line);margin:8px 0;z-index:0}.lnum{background:var(--p);color:#fff;border-radius:50%;width:26px!important;height:26px!important;display:grid!important;place-items:center;font:900 13px Mulish;border:2px solid #fff;box-shadow:0 1px 4px #0006}.lyo{background:var(--sky);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 6px #00a6e633}
.oferta{border:2px solid var(--p);border-radius:16px;padding:12px 14px;margin:10px 0;background:#f7fbff}.oferta.nueva{animation:pulso 1s 3}@keyframes pulso{50%{box-shadow:0 0 0 8px #0b5cad33}}.oferta .top{display:flex;justify-content:space-between}.oferta .t{font-size:12px;font-weight:900;color:var(--bad)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 b{display:block}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tipo{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:center;font-weight:800;font-size:13px}.tipo svg{width:100%;height:46px}.tipo.on{border-color:var(--p);background:#eef5fd}
.pasos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paso{border:1.5px solid var(--line);border-radius:12px;padding:8px 9px;text-align:left;background:#fff;font-weight:700;font-size:13px;min-height:54px;display:flex;gap:8px;align-items:center}.paso .ic{width:38px;height:38px;border-radius:8px;background:var(--soft);flex:none;display:grid;place-items:center;overflow:hidden;font-size:16px}.paso .ic img{width:100%;height:100%;object-fit:cover}.paso.ok{border-color:#9fd4bd;background:#f2faf6}.paso.sig{border-color:var(--p);box-shadow:0 0 0 3px #0b5cad22}
.bar{height:8px;border-radius:4px;background:#e3e9f0;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.sec{border:1px solid var(--line);border-radius:14px;margin:9px 0;overflow:hidden}.sec>button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;padding:12px 13px;font-weight:800}.sec .in{padding:0 13px 10px;display:none}.sec.open .in{display:block}
.f{margin:10px 0}.f label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:#fff}.org{font-size:11.5px;font-weight:800;margin-top:3px}.org.pre{color:var(--ok)}.org.conf{color:var(--warn)}.req{color:var(--bad)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;padding:9px 4px;font-weight:800;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}.seg button:last-child{border:0}.seg button.on{background:var(--p);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f6;gap:10px}.tog{width:48px;height:28px;border-radius:14px;background:#cfd8e2;position:relative;border:0;flex:none}.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--ok)}.tog.on:after{left:23px}
.kpi{border-radius:12px;background:var(--soft);padding:10px}.kpi small{color:var(--muted);font-weight:700;font-size:12px}.kpi b{display:block;font-size:19px}
.sheet{position:fixed;inset:0;background:#0b1a2a77;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet>div{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;display:none;z-index:80;max-width:90vw;text-align:center}
.lock{position:fixed;inset:0;background:#101010;color:#fff;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}.lock img{width:240px;height:auto}.pin{display:flex;gap:10px;margin:8px 0}.pin i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.pin i.on{background:#fff}.kp{display:grid;grid-template-columns:repeat(3,64px);gap:10px}.kp button{height:56px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:22px;font-weight:800}
.prueba{margin-top:24px;border-top:1px dashed var(--line);padding-top:10px}.prueba summary{font-size:12.5px;color:var(--muted);font-weight:800}.prueba .r{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.prueba button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
/* Cámara guiada: la interfaz gira con el celular aunque la pantalla tenga el bloqueo de rotación */
.cam{position:fixed;left:0;top:0;width:100vw;height:100vh;background:#000;z-index:50;color:#fff;overflow:hidden;transform-origin:0 0}.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cam .mask{position:absolute;inset:0;width:100%;height:100%}.cam svg.cont{position:absolute;pointer-events:none}
.cTop{position:absolute;left:0;right:0;top:0;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#000a,#0000);z-index:3}.cTop b{font-size:15px}.cBack{background:#0008;color:#fff;border:1px solid #fff5;border-radius:10px;padding:8px 12px;font-weight:800}
.cMsg{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:#0009;border-radius:12px;padding:7px 14px;font-weight:800;font-size:15px;white-space:nowrap;z-index:3}.cMsg.ok{background:#1f7a5ce6}
.cChips{position:absolute;left:8px;right:110px;bottom:14px;display:flex;gap:5px;flex-wrap:wrap;z-index:3}.cChips span{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:#0007;border:1px solid #fff4}.cChips .k{border-color:#3ddc97aa}.cChips .w{border-color:#ffc857aa;color:#ffe2a0}
.cShot{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff3;z-index:3}.cShot:not(:disabled){background:#fff}.cShot:disabled{opacity:.45}
.cam.v .cShot{right:auto;left:50%;top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}.cam.v .cMsg{bottom:calc(178px + env(safe-area-inset-bottom,0px))}.cam.v .cChips{right:8px;bottom:calc(46px + env(safe-area-inset-bottom,0px));justify-content:center}.cam.v .cTop{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.cIgual{position:absolute;right:16px;bottom:14px;background:#0009;color:#fff;border:1px solid #fff6;border-radius:12px;padding:8px 12px;font-weight:800;z-index:3}
.det{position:absolute;border:3px solid #ffd166;border-radius:8px;z-index:2;display:none}
.cRot{position:absolute;inset:0;background:#0b1a2af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:4}.cRot[hidden]{display:none}.cRot .ph{font-size:46px;animation:gira 1.6s ease-in-out infinite}@keyframes gira{50%{transform:rotate(90deg)}}
.cam.rev{background:#0b1a2a;display:flex;flex-direction:column;transform:none!important;width:100vw!important;height:100vh!important}.cam.rev .cTop{position:static;padding-top:calc(8px + env(safe-area-inset-top,0px))}.revImg{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}.revImg img{max-width:100%;max-height:100%;border-radius:10px}.revAct{padding:10px 18px calc(16px + env(safe-area-inset-bottom,0px))}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
</style></head><body>

 const vis=()=>{const {W,H}=dims(),vw=video.videoWidth,vh=video.videoHeight;if(!vw)return null;const s=Math.max(W/vw,H/vh);return {W,H,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};};
 function marco(g,ok){const {W,H}=dims();mask.width=W;mask.height=H;const m=mask.getContext('2d');if(p.g==='silueta'){m.clearRect(0,0,W,H);const geo=GEO[v.carro]||GEO.sedan,cb=geo.cajas[p.v],vb=geo.vbs[p.v],cx=p.espejo?[vb[2]-cb[0]-cb[2],cb[1],cb[2],cb[3]]:cb;Object.assign(svg.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});svg.setAttribute('viewBox',cx.join(' '));svg.setAttribute('preserveAspectRatio','xMidYMid meet');const path='<path d="'+geo.contorno[p.v]+'" fill="none" stroke="'+(ok?'#3ddc97':'#fff')+'" stroke-width="2.6" stroke-dasharray="7 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';svg.innerHTML=p.espejo?'<g transform="translate('+vb[2]+',0) scale(-1,1)">'+path+'</g>':path;return;}
  svg.innerHTML='';m.fillStyle='rgba(0,0,0,.55)';m.fillRect(0,0,W,H);m.clearRect(g.x,g.y,g.w,g.h);m.strokeStyle=ok?'#3ddc97':'#fff';m.lineWidth=3;m.setLineDash(ok?[]:[10,7]);m.strokeRect(g.x,g.y,g.w,g.h);m.setLineDash([]);}
 function medir(g,r){const N=160,sw=g.w/r.s,sh=g.h/r.s,sx=(g.x-r.ox)/r.s,sy=(g.y-r.oy)/r.s;off.width=N;off.height=Math.max(8,Math.round(N*sh/sw));ox.drawImage(video,sx,sy,sw,sh,0,0,off.width,off.height);const D=ox.getImageData(0,0,off.width,off.height).data,w=off.width,h=off.height,Y=new Float32Array(w*h);let s=0,sat=0;for(let i=0,q=0;i<D.length;i+=4,q++){const y=.299*D[i]+.587*D[i+1]+.114*D[i+2];Y[q]=y;s+=y;if(y>248)sat++;}
  let l=0,n=0,e=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const q=y*w+x,lp=4*Y[q]-Y[q-1]-Y[q+1]-Y[q-w]-Y[q+w];l+=lp*lp;n++;if(Math.hypot(Y[q+1]-Y[q-1],Y[q+w]-Y[q-w])>40)e++;}
  const b=Math.max(3,Math.round(h*.12)),bd=(ys,ye,xs,xe,hz)=>{let c=0,t=0;for(let y=ys;y<ye;y++)for(let x=xs;x<xe;x++){const q=y*w+x;if((hz?Math.abs(Y[q+w]-Y[q-w]):Math.abs(Y[q+1]-Y[q-1]))>28)c++;t++;}return c/t;};
  return {media:s/(w*h),sat:sat/(w*h),lap:l/n,bordes:e/n,lados:p.g==='tarjeta'?[bd(1,b,4,w-4,1),bd(h-b,h-1,4,w-4,1),bd(4,h-4,1,b,0),bd(4,h-4,w-b,w-1,0)].filter(x=>x>.05).length:0};}
 function tick(){ajustarGiro();const r=vis();if(!r){loop=requestAnimationFrame(tick);return;}const g=caja(p,r.W,r.H),pos=postura(),fisH=pos!=='v'||(orient.beta==null&&innerWidth>innerHeight),oriOk=p.o==='h'?fisH:!fisH||innerHeight>innerWidth&&orient.beta==null;
  const rot=div.querySelector('#crot');rot.hidden=oriOk;div.querySelector('#crt').textContent=p.o==='h'?'Gira el celular a horizontal':'Pon el celular en vertical';
  const m=medir(g,r),E={ori:[oriOk,''],luz:[m.media>60&&m.media<220,m.media<=60?'Busca más luz':'Hay demasiada luz'],nit:[m.lap>65&&orient.mov<1.3,'Mantén el celular quieto']};
  if(p.g==='tarjeta'){E.enc=[m.lados>=3,'Alinea los bordes con el marco'];E.ref=[m.sat<.06,'Hay un reflejo: inclina un poco'];}
  else if(p.g==='silueta'){if(detector&&!detOc&&video.readyState>=2){detOc=true;detector.detect(video,5,.35).then(rs=>{detOc=false;const c=rs.filter(o=>['car','truck','bus','motorcycle'].includes(o.class)).sort((a,b)=>b.bbox[2]*b.bbox[3]-a.bbox[2]*a.bbox[3])[0];ult=c?c.bbox:null;}).catch(()=>detOc=false);}
   const dv=div.querySelector('#det');if(detEst!=='listo'){E.enc=[false,detEst==='no disponible'?'No pudimos verificar el encuadre':'Preparando la detección…'];dv.style.display='none';}
   else if(!ult){E.enc=[false,'No vemos el vehículo'];dv.style.display='none';}
   else{const [bx,by,bw,bh]=ult,X=bx*r.s+r.ox,Yp=by*r.s+r.oy,Wb=bw*r.s,Hb=bh*r.s;Object.assign(dv.style,{display:'block',left:X+'px',top:Yp+'px',width:Wb+'px',height:Hb+'px'});const rw=Wb/g.w,o1=Math.abs(X+Wb/2-(g.x+g.w/2))/g.w,o2=Math.abs(Yp+Hb/2-(g.y+g.h/2))/g.h;E.enc=rw<.72?[false,'Acércate un poco']:rw>1.12?[false,'Aléjate un paso']:(o1>.12||o2>.18)?[false,'Centra el vehículo en el contorno']:[true,''];dv.style.borderColor=E.enc[0]?'#3ddc97':'#ffd166';}}
  else E.enc=[m.bordes>.05,'Centra lo que fotografías en el marco'];
  const ok=Object.values(E).every(x=>x[0]);marco(g,ok);const nom={ori:p.o==='h'?'Horizontal':'Vertical',luz:'Luz',nit:'Nitidez',enc:'Encuadre',ref:'Reflejo'};
  div.querySelector('#cch').innerHTML=Object.entries(E).map(([k,x])=>'<span class="'+(x[0]?'k':'w')+'">'+(x[0]?'✓':'!')+' '+nom[k]+'</span>').join('');
  const malo=Object.entries(E).find(([k,x])=>!x[0]);const cm=div.querySelector('#cmsg');cm.textContent=malo?(malo[0]==='ori'?(p.o==='h'?'Gira el celular a horizontal':'Pon el celular en vertical'):malo[1][1]):'Listo: toma la foto';cm.className='cMsg'+(ok?' ok':'');
  div.querySelector('#csh').disabled=!ok;div.querySelector('#cig').hidden=ok||!oriOk||Date.now()-t0<6000;loop=requestAnimationFrame(tick);}
 loop=requestAnimationFrame(tick);
 // Lo que se ve es lo que se guarda: recorte del cuadro de la guía; si la interfaz estaba girada por software, la foto se endereza.
 const disparar=f=>{const r=vis();if(!r)return;const g=caja(p,r.W,r.H),sw=g.w/r.s,sh=g.h/r.s,sx=(g.x-r.ox)/r.s,sy=(g.y-r.oy)/r.s,k=Math.min(1,1600/sw);let c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
  const gr=giro;cerrar();revisar(p,c,f?'Tomada igual':'Validada en el celular'+(gr?' · interfaz girada':''));};

function sistema(p){toast('Usaremos la cámara del celular');const inp=$('#fCam');inp.onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);revisar(p,c,'Cámara del sistema: encuadre no verificado');};im.src=URL.createObjectURL(f);};inp.click();}
function revisar(p,c,val){const url=c.toDataURL('image/jpeg',.82),div=document.createElement('div');div.className='cam rev';div.innerHTML='<div class="cTop"><span></span><b>'+esc(p.n)+'</b><span></span></div><div class="revImg"><img src="'+url+'" alt="Foto tomada"></div><div class="revAct"><button class="btn" id="rok">Usar esta foto</button><button class="btn btn2" id="rno" style="background:transparent;color:#fff;border-color:#fff8">Repetir</button></div>';document.body.appendChild(div);
 div.querySelector('#rno').onclick=()=>{div.remove();camara(p.id);};
 div.querySelector('#rok').onclick=async()=>{div.remove();const v=VA();await fotoPut(v.id+'_'+p.id,url);let gps=null;try{gps=await new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>ok([+x.coords.latitude.toFixed(5),+x.coords.longitude.toFixed(5)]),()=>ok(null),{timeout:4000,maximumAge:30000}):ok(null));}catch(e){}
  v.fotos[p.id]={t:Date.now(),val,gps};guardar();encolar({tipo:'foto',vis:v.id,paso:p.id});pintar();if(p.ocr)leer(p,c);};}
// ====== Lectura en el celular (la confirma el motor de extracción de SIRIUS) ======
let ocrW=null;async function wk(){if(!window.Tesseract)await carga('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');if(!ocrW)ocrW=await Tesseract.createWorker('eng');return ocrW;}
async function leer(p,c){const v=VA();try{const w=await wk();await w.setParameters({tessedit_pageseg_mode:p.ocr==='matricula'?'6':'11'});const r=await w.recognize(c),T=(r.data.text||'').toUpperCase().replace(/\s+/g,' '),conf=Math.round(r.data.confidence||0);
 const put=(k,val)=>{if(!val)return;v.lect[k]={valor:val,conf,paso:p.n};if(v.form&&v.form[k]&&!v.form[k].valor)v.form[k]={valor:val,org:'Foto «'+p.n+'»',conf};};
 if(p.ocr==='placa'||p.ocr==='matricula'){const m=T.match(/\b([A-Z]{2,3})[- ]?(\d{3,4}[A-Z]?)\b/);if(m)put('placa',m[1]+m[2]);}
 if(p.ocr==='vin'||p.ocr==='matricula'){const m=T.replace(/[^A-Z0-9 ]/g,'').match(/\b[A-HJ-NPR-Z0-9]{17}\b/);if(m)put('vin',m[0]);}
 if(p.ocr==='motor'){const m=T.replace(/[^A-Z0-9 ]/g,'').match(/\b[A-Z0-9]{6,14}\b/);if(m)put('motor',m[0]);}
 if(p.ocr==='km'){const m=(T.match(/\d{3,7}/g)||[]).sort((a,b)=>b.length-a.length)[0];if(m)put('km',m);}guardar();}catch(e){}}
// ====== Lo que recibe SIRIUS ======
function verSirius(){const v=VA(),F=v.form||{};const fila=(l,c,e)=>'<tr><td>'+l+'</td><td><b>'+esc(c&&c.valor||'—')+'</b><br><small class="mut">'+esc(c&&c.org||'')+(c&&c.conf?' · '+c.conf+' %':'')+'</small></td><td>'+(e&&c&&c.valor?(c.valor===e?'<span class="chip c-a">Coincide</span>':'<span class="chip c-x">No coincide</span>'):'')+'</td></tr>';
 const s=document.createElement('div');s.className='sheet';s.innerHTML='<div><b style="font-size:17px">Lo que recibe SIRIUS · caso '+v.caso+'</b><p class="mut sm">'+plantDe(v).nombre+' · '+TIPOV[v.carro]+'<br>Llegada: '+esc(v.llegada?v.llegada.txt:'—')+'</p><table class="tbl">'+fila('Placa',F.placa,v.placa)+fila('VIN',F.vin)+fila('Nº de motor',F.motor)+fila('Año',F.anio,v.anio)+fila('Kilometraje',F.km)+'<tr><td>Daños</td><td colspan="2">'+((F.danos||[]).map(d=>esc(d.zona+' · '+d.tipo+' · '+d.grav)).join('<br>')||'Ninguno')+'</td></tr><tr><td>Fotos</td><td colspan="2">'+Object.keys(v.fotos||{}).length+' de '+plantDe(v).pasos.length+'</td></tr><tr><td>Determinación</td><td colspan="2">'+esc(v.det||'—')+(v.detMotivo?' · '+esc(v.detMotivo):'')+'</td></tr></table><button class="btn" onclick="this.closest(\'.sheet\').remove()">Cerrar</button></div>';document.body.appendChild(s);}

function prueba(){const v=VA();return '<details class="prueba"><summary>Opciones de prueba</summary><div class="r"><button onclick="S.perfil=S.perfil===\'agencia\'?\'indep\':\'agencia\';guardar();pintar()">Ver como '+(S.perfil==='agencia'?'inspectora independiente':'inspector de agencia')+'</button>'+(S.p==='visita'&&v&&v.st==='pend'?'<button onclick="aqui()">Poner esta visita en mi ubicación</button>':'')+(S.p==='visita'&&v&&v.st==='cur'?'<button onclick="completarFotos()">Completar las fotos con imágenes de prueba</button>':'')+'<button onclick="audioOn();llegaOferta()">Recibir una oferta (con sonido)</button><button onclick="if(confirm(\'¿Reiniciar la prueba?\')){localStorage.removeItem(CLAVE);window.indexedDB&&indexedDB.deleteDatabase(\'sirius-inspector\');location.reload()}">Reiniciar la prueba</button></div></details>';}

// ====== Bloqueo con PIN ======
function bloqueo(){if(!S.bloq)return;let pin='';const d=document.createElement('div');d.className='lock';const dib=()=>{d.innerHTML='<img src="'+SLOGO+'" alt="Aseguradora del Sur · SIRIUS"><b style="font-size:18px">SIRIUS Inspector</b><span class="sm" style="opacity:.85">Ingresa tu PIN de 6 dígitos (prueba: 123456)</span><div class="pin">'+[0,1,2,3,4,5].map(i=>'<i class="'+(i<pin.length?'on':'')+'"></i>').join('')+'</div><div class="kp">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':'<button data-k="'+k+'">'+k+'</button>').join('')+'</div><span class="sm" style="opacity:.7">Renueva tu sesión conectándote al menos cada 7 días.</span>';
 d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{audioOn();const k=b.dataset.k;pin=k==='⌫'?pin.slice(0,-1):(pin+k).slice(0,6);if(pin.length===6){if(pin===CFG.pin){S.bloq=false;guardar();d.remove();return;}toast('PIN incorrecto');pin='';}dib();});};dib();document.body.appendChild(d);}
