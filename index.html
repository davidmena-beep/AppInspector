function sistema(p){toast('Usaremos la cámara del celular');const inp=$('#fCam');inp.onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);revisar(p,c,'Cámara del sistema: encuadre no verificado');};im.src=URL.createObjectURL(f);};inp.click();}
function revisar(p,c,val){const url=c.toDataURL('image/jpeg',.82),div=document.createElement('div');div.className='cam rev';div.innerHTML='<div class="cTop"><span></span><b>'+esc(p.n)+'</b><span></span></div><div class="revImg"><img src="'+url+'" alt="Foto tomada"></div><div class="revAct"><button class="btn" id="rok">Usar esta foto</button><button class="btn btn2" id="rno" style="background:transparent;color:#fff;border-color:#fff8">Repetir</button></div>';document.body.appendChild(div);
 div.querySelector('#rno').onclick=()=>{div.remove();camara(p.id);};
 div.querySelector('#rok').onclick=async()=>{div.remove();const v=VA(),k=v.id+'_'+p.id;await fotoPut(k,url);let gps=null;try{gps=await new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>ok([+x.coords.latitude.toFixed(5),+x.coords.longitude.toFixed(5)]),()=>ok(null),{timeout:4000,maximumAge:30000}):ok(null));}catch(e){}
  v.fotos[p.id]={t:Date.now(),val,gps};guardar();encolar({tipo:'foto',vis:v.id,paso:p.id});pintar();if(p.ocr)leer(p,c);if(p.doc&&p.id==='mat_f')leer({id:'mat_f',n:p.n,ocr:'matricula'},c);};}
// ====== Lectura (primera lectura en el celular; la confirma el motor de extracción de SIRIUS) ======
let ocrW=null;async function wk(){if(!window.Tesseract)await carga('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');if(!ocrW)ocrW=await Tesseract.createWorker('eng');return ocrW;}
async function leer(p,c){const v=VA();try{const w=await wk();await w.setParameters({tessedit_pageseg_mode:p.ocr==='matricula'?'6':'11'});const r=await w.recognize(c),T=(r.data.text||'').toUpperCase().replace(/\s+/g,' '),conf=Math.round(r.data.confidence||0);
 const put=(k,val)=>{if(val){v.lect[k]={valor:val,conf,paso:p.n};if(v.form&&v.form[k]&&!v.form[k].valor)v.form[k]={valor:val,org:'Foto «'+p.n+'» (lectura)',conf};}};
 if(p.ocr==='placa'||p.ocr==='matricula'){const m=T.match(/\b([A-Z]{3})[- ]?(\d{3,4})\b/);if(m)put('placa',m[1]+m[2]);}
 if(p.ocr==='vin'||p.ocr==='matricula'){const m=T.replace(/[^A-Z0-9 ]/g,'').match(/\b[A-HJ-NPR-Z0-9]{17}\b/);if(m)put('vin',m[0]);}
 if(p.ocr==='km'){const m=(T.match(/\d{3,7}/g)||[]).sort((a,b)=>b.length-a.length)[0];if(m)put('km',m);}guardar();}catch(e){}}
// ====== Lo que recibe SIRIUS ======
function verSirius(){const v=VA();const F=v.form||{};const fila=(l,c,e)=>'<tr><td>'+l+'</td><td><b>'+esc(c&&c.valor||'—')+'</b><br><small class="mut">'+esc(c&&c.org||'')+(c&&c.conf?' · '+c.conf+' %':'')+'</small></td><td>'+(e&&c&&c.valor?(c.valor===e?'<span class="chip c-a">Coincide</span>':'<span class="chip c-x">No coincide</span>'):'')+'</td></tr>';
 const s=document.createElement('div');s.className='sheet';s.innerHTML='<div><b style="font-size:17px">Lo que recibe SIRIUS · caso '+v.caso+'</b><p class="mut sm">Llegada: '+esc(v.llegada?v.llegada.txt:'—')+'</p><table class="tbl">'+fila('Placa',F.placa,v.placa)+fila('VIN',F.vin)+fila('Año',F.anio,v.anio)+fila('Kilometraje',F.km)+'<tr><td>Estado</td><td colspan="2">Pintura '+(F.pintura||'—')+' · carrocería '+(F.carroceria||'—')+' · llantas '+(F.llantas||'—')+'</td></tr><tr><td>Fotos</td><td colspan="2">'+Object.keys(v.fotos||{}).length+' de '+PASOS.length+' · '+Object.values(v.fotos||{}).filter(f=>f.val!=='Validada en el celular').length+' sin validación completa</td></tr><tr><td>Determinación</td><td colspan="2">'+esc(v.det||'—')+(v.detMotivo?' · '+esc(v.detMotivo):'')+'</td></tr></table><button class="btn" onclick="this.closest(\'.sheet\').remove()">Cerrar</button></div>';document.body.appendChild(s);}
// ====== Opciones de prueba ======
function prueba(){const v=VA();return '<details class="prueba"><summary>Opciones de prueba</summary><div class="r">'+(v&&v.st==='pend'?'<button onclick="aqui()">Poner la dirección de esta visita en mi ubicación</button>':'')+(v&&v.st==='cur'?'<button onclick="completarFotos()">Completar las fotos con imágenes de prueba</button>':'')+'<button onclick="nuevaOferta()">Recibir una oferta nueva</button><button onclick="if(confirm(\'¿Reiniciar la prueba? Se borra todo.\')){localStorage.removeItem(CLAVE);indexedDB.deleteDatabase(\'sirius-inspector\');location.reload()}">Reiniciar la prueba</button></div></details>';}
function aqui(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{const v=VA();v.lat=p.coords.latitude;v.lng=p.coords.longitude;guardar();toast('Listo: la visita está en tu ubicación actual');},()=>toast('No pudimos obtener tu ubicación'));}
function completarFotos(){const v=VA();PASOS.forEach(p=>{if(!v.fotos[p.id])v.fotos[p.id]={t:Date.now(),val:'Imagen de prueba',gps:null};});guardar();pintar();}
function nuevaOferta(){S.ofertas.push(Object.assign({},OFERTAS0[0],{id:'o'+Date.now(),seg:300}));guardar();pintar();toast('Llegó una oferta nueva');}
// ====== Bloqueo con PIN (dispositivo de confianza) ======
function bloqueo(){if(!S.bloq)return;let pin='';const d=document.createElement('div');d.className='lock';const dib=()=>{d.innerHTML='<b style="font-size:20px">SIRIUS Inspector</b><span class="sm" style="opacity:.85">Ingresa tu PIN de 6 dígitos<br>(prueba: 123456)</span><div class="pin">'+[0,1,2,3,4,5].map(i=>'<i class="'+(i<pin.length?'on':'')+'"></i>').join('')+'</div><div class="kp">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':'<button data-k="'+k+'">'+k+'</button>').join('')+'</div><span class="sm" style="opacity:.75">Renueva tu sesión conectándote al menos cada 7 días.</span>';
 d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;pin=k==='⌫'?pin.slice(0,-1):(pin+k).slice(0,6);if(pin.length===6){if(pin===CFG.pin){S.bloq=false;guardar();d.remove();return;}toast('PIN incorrecto');pin='';}dib();});};dib();document.body.appendChild(d);}
// ====== Pintar ======
async function miniaturas(){const v=VA();if(!v||!v.fotos||!window.indexedDB)return;for(const p of PASOS){if(v.fotos[p.id]){const e=$('#mi_'+p.id);if(e&&!e.querySelector('img')){const u=await fotoGet(v.id+'_'+p.id);if(u)e.innerHTML='<img src="'+u+'" alt="">';}}}}
function pintar(){$('#who').textContent='Mauricio Endara · red Eurosurvey';$('#hoyTxt').textContent=fHoy();$('#scr').innerHTML=(V[S.p]||V.hoy)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===S.sec));const bo=$('#bo');bo.textContent=S.ofertas.length;bo.style.display=S.ofertas.length&&S.recibir?'':'none';netBar();miniaturas();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>ir(b.dataset.n,b.dataset.n));
setInterval(()=>{if(!S.ofertas.length)return;S.ofertas.forEach(o=>o.seg=Math.max(0,o.seg-1));const fue=S.ofertas.filter(o=>!o.seg).length;S.ofertas=S.ofertas.filter(o=>o.seg);if(fue){guardar();if(S.p==='ofertas')toast('Una oferta venció: la tomó otro inspector');pintar();return;}S.ofertas.forEach((o,i)=>{const e=$('#ot'+i);if(e)e.textContent='⏱ '+Math.floor(o.seg/60)+':'+p2(o.seg%60);});},1000);
pintar();bloqueo();sync();
