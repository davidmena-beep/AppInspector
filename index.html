<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SIRIUS Inspector · Aseguradora del Sur</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#0f1b2d;--muted:#64748b;--line:#e5eaf0;--soft:#f5f7fa;--p:#0B5CAD;--sky:#00A6E6;--dk:#0b1220;--ok:#16a34a;--okbg:#e8f7ee;--warn:#b45309;--warnbg:#fef5e7;--bad:#dc2626;--badbg:#fdecec;--r:18px;--sh:0 1px 2px #0f1b2d0d,0 6px 20px #0f1b2d0f}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#eef2f7;font:400 15.5px/1.45 Mulish,system-ui,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #7fb0f5;outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--soft);display:flex;flex-direction:column;box-shadow:0 0 40px #0b122014}
.hd{padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:linear-gradient(135deg,#0b1220,#0e2440);color:#fff;display:flex;justify-content:space-between;align-items:center}.hd img{height:40px;width:auto;display:block}.hd .u{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.25;text-align:right}.hd .u b{font-size:13px;display:block}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--p));display:grid;place-items:center;font-weight:900;font-size:13px}
.net{font-size:12.5px;font-weight:800;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.net.on{background:#e8f7ee;color:#15803d}.net.off{background:var(--warnbg);color:var(--warn)}.net button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;font-size:12px;padding:0}
.scr{flex:1;overflow:auto;padding:14px 16px 24px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}.nav button{border:0;background:none;padding:6px 0 7px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}.nav button.on{color:var(--p);background:#eef5fd}.nav .b{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px}
h1{font-size:23px;margin:2px 0 4px;line-height:1.2;letter-spacing:-.2px}h2{font-size:15px;margin:18px 0 8px;letter-spacing:-.1px}.mut{color:var(--muted)}.sm{font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin:10px 0;box-shadow:var(--sh)}.card.hi{border-color:#cfe2f7;background:#f6faff}.card.warn{border-color:#f6d9a8;background:#fffaf0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;background:var(--p);color:#fff;margin-top:10px;min-height:50px;text-align:center;text-decoration:none;box-shadow:0 4px 14px #0b5cad33}.btn:disabled{opacity:.45;box-shadow:none}.btn2{background:#fff;color:var(--p);border:1.5px solid #cfe2f7;box-shadow:none}.btng{background:var(--ok);box-shadow:0 4px 14px #16a34a33}.btnr{background:#fff;color:var(--bad);border:1.5px solid #f6c6c6;box-shadow:none}.btn3{background:none;color:var(--muted);border:0;font-weight:800;padding:6px 0;display:inline-flex;align-items:center;gap:4px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.act{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px 4px 10px;font-weight:800;font-size:12.5px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;box-shadow:var(--sh)}.act span{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#eef5fd;color:var(--p)}.act.go span{background:#e8f7ee;color:var(--ok)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-weight:900;font-size:17px;padding:17px;margin-top:4px;box-shadow:0 8px 22px #16a34a40}.big svg.i{width:26px;height:26px}
.vis{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;background:#fff;width:100%;text-align:left;box-shadow:var(--sh)}.vis .n{width:32px;height:32px;border-radius:10px;background:#eef5fd;color:var(--p);display:grid;place-items:center;font-weight:900}.vis b{display:block}.vis small{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:900;white-space:nowrap}.c-p{background:var(--warnbg);color:var(--warn)}.c-r{background:#e8eef6;color:#334e70}.c-a{background:var(--okbg);color:#15803d}.c-x{background:var(--badbg);color:var(--bad)}
#mapa{height:220px;border-radius:var(--r);border:1px solid var(--line);margin:8px 0 4px;z-index:0;box-shadow:var(--sh)}.lnum{background:var(--p);color:#fff;border-radius:10px;width:26px!important;height:26px!important;display:grid!important;place-items:center;font:900 13px Mulish;border:2px solid #fff;box-shadow:0 2px 6px #0006}.lyo{background:var(--sky);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 7px #00a6e633}
.oferta{background:#fff;border:1.5px solid #cfe2f7;border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--sh)}.oferta.nueva{animation:pulso 1s 3}@keyframes pulso{50%{box-shadow:0 0 0 8px #0b5cad26}}.oferta .top{display:flex;justify-content:space-between;align-items:center}.oferta .t{font-size:12px;font-weight:900;color:var(--bad);display:flex;align-items:center;gap:4px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 b{display:block}
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tipo{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:6px 4px;text-align:center;font-weight:800;font-size:11.5px}.tipo svg{width:100%;height:30px}.tipo.on{border-color:var(--p);background:#eef5fd;color:var(--p)}
.cap{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);margin:10px 0}.capTop{display:flex;align-items:center;gap:12px}.ring{width:58px;height:58px;flex:none}.capTop b{font-size:16px}
.vmap{position:relative;margin:12px 6px 6px}.vmap svg.ic{width:100%;height:auto;display:block;opacity:.92}.vpt{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2.5px solid var(--p);background:#fff;color:var(--p);font-weight:900;font-size:12px;display:grid;place-items:center;padding:0}.vpt.ok{background:var(--ok);border-color:#fff;color:#fff}.vpt.sig{background:var(--p);color:#fff;box-shadow:0 0 0 6px #0b5cad33;animation:lat 1.6s infinite}@keyframes lat{50%{box-shadow:0 0 0 11px #0b5cad14}}
.nextBtn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,var(--p),#0a4a8c);color:#fff;padding:14px 16px;margin-top:10px;text-align:left;box-shadow:0 8px 22px #0b5cad40}.nextBtn .ph{width:46px;height:46px;border-radius:14px;background:#ffffff22;display:grid;place-items:center;flex:none}.nextBtn small{display:block;opacity:.85;font-size:12px;font-weight:700}.nextBtn b{font-size:17px}
.grupo{margin-top:10px}.grupo h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.pasos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paso{border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;background:#fff;font-weight:700;font-size:12.5px;min-height:52px;display:flex;gap:8px;align-items:center}.paso .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--muted)}.paso .ic img{width:100%;height:100%;object-fit:cover}.paso.ok{border-color:#bfe6cc;background:#f3fbf6}.paso.ok .ic{color:var(--ok)}.paso.sig{border-color:var(--p);box-shadow:0 0 0 3px #0b5cad1f}
.bar{height:8px;border-radius:4px;background:#e3e9f0;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden;box-shadow:var(--sh)}.sec>button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;padding:13px 14px;font-weight:800}.sec .in{padding:0 14px 12px;display:none}.sec.open .in{display:block}
.f{margin:10px 0}.f label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:5px}.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:#fff}.org{font-size:11.5px;font-weight:800;margin-top:4px}.org.pre{color:#15803d}.org.conf{color:var(--warn)}.req{color:var(--bad)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:9px 4px;font-weight:800;font-size:13px;color:var(--muted);border-radius:10px}.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px #0f1b2d1f}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.tog{width:50px;height:30px;border-radius:15px;background:#cbd5e1;position:relative;border:0;flex:none}.tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}.tog.on{background:var(--ok)}.tog.on:after{left:23px}
.kpi{border-radius:14px;background:#fff;border:1px solid var(--line);padding:11px}.kpi small{color:var(--muted);font-weight:700;font-size:12px}.kpi b{display:block;font-size:19px}
.sheet{position:fixed;inset:0;background:#0b122088;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet>div{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;display:none;z-index:80;max-width:90vw;text-align:center;box-shadow:0 8px 24px #0005}
.lock{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 20%,#132a4d,#070b14 70%);color:#fff;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}.lock img{width:min(86vw,360px);height:auto;margin-bottom:6px}.pin{display:flex;gap:12px;margin:10px 0}.pin i{width:13px;height:13px;border-radius:50%;border:2px solid #ffffffb0}.pin i.on{background:#fff;border-color:#fff}.kp{display:grid;grid-template-columns:repeat(3,68px);gap:12px}.kp button{height:62px;border-radius:50%;border:1px solid #ffffff22;background:#ffffff12;color:#fff;font-size:22px;font-weight:700;backdrop-filter:blur(6px)}
.prueba{margin-top:26px;border-top:1px dashed var(--line);padding-top:10px}.prueba summary{font-size:12.5px;color:var(--muted);font-weight:800}.prueba .r{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.prueba button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
/* Cámara guiada: el video llena la pantalla; la capa de la interfaz gira según la posición física del celular */
.cam{position:fixed;inset:0;background:#000;z-index:50;color:#fff;overflow:hidden}.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0}.ov .mask{position:absolute;inset:0;width:100%;height:100%}.ov svg.cont{position:absolute;pointer-events:none}
.cTop{position:absolute;left:0;right:0;top:0;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#000a,#0000);z-index:3}.cTop b{font-size:15px}.cBack{background:#0008;color:#fff;border:1px solid #fff5;border-radius:10px;padding:8px 12px;font-weight:800}
.cMsg{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:#0009;border-radius:12px;padding:7px 14px;font-weight:800;font-size:15px;white-space:nowrap;z-index:3}.cMsg.ok{background:#1f7a5ce6}
.cChips{position:absolute;left:8px;right:110px;bottom:14px;display:flex;gap:5px;flex-wrap:wrap;z-index:3}.cChips span{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:#0007;border:1px solid #fff4}.cChips .k{border-color:#3ddc97aa}.cChips .w{border-color:#ffc857aa;color:#ffe2a0}
.cShot{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff3;z-index:3}.cShot:not(:disabled){background:#fff}.cShot:disabled{opacity:.45}
.ov.v .cShot{right:auto;left:50%;top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}.ov.v .cMsg{bottom:calc(178px + env(safe-area-inset-bottom,0px))}.ov.v .cChips{right:8px;bottom:calc(46px + env(safe-area-inset-bottom,0px));justify-content:center}.ov.v .cTop{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.cIgual{position:absolute;right:16px;bottom:14px;background:#0009;color:#fff;border:1px solid #fff6;border-radius:12px;padding:8px 12px;font-weight:800;z-index:3}
.det{position:absolute;border:3px solid #ffd166;border-radius:8px;z-index:2;display:none}
.cRot{position:absolute;inset:0;background:#0b1a2af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:4}.cRot[hidden]{display:none}.cRot .ph{font-size:46px;animation:gira 1.6s ease-in-out infinite}@keyframes gira{50%{transform:rotate(90deg)}}
.revL{position:absolute;inset:0;background:#0b1a2a;z-index:5;display:flex;flex-direction:column}.revL[hidden]{display:none}.revImg{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}.revImg img{max-width:100%;max-height:100%;border-radius:10px}.revAct{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
</style></head><body>

 function marco(g,ok){const {W,H}=dimOv();mask.width=W;mask.height=H;const m=mask.getContext('2d');if(p.g==='silueta'){m.clearRect(0,0,W,H);const geo=GEO[v.carro]||GEO.sedan,cb=geo.cajas[p.v],vb=geo.vbs[p.v],cx=p.espejo?[vb[2]-cb[0]-cb[2],cb[1],cb[2],cb[3]]:cb;Object.assign(svg.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});svg.setAttribute('viewBox',cx.join(' '));svg.setAttribute('preserveAspectRatio','xMidYMid meet');const path='<path d="'+geo.contorno[p.v]+'" fill="none" stroke="'+(ok?'#3ddc97':'#fff')+'" stroke-width="2.6" stroke-dasharray="7 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';svg.innerHTML=p.espejo?'<g transform="translate('+vb[2]+',0) scale(-1,1)">'+path+'</g>':path;return;}
  svg.innerHTML='';m.fillStyle='rgba(0,0,0,.55)';m.fillRect(0,0,W,H);m.clearRect(g.x,g.y,g.w,g.h);m.strokeStyle=ok?'#3ddc97':'#fff';m.lineWidth=3;m.setLineDash(ok?[]:[10,7]);m.strokeRect(g.x,g.y,g.w,g.h);m.setLineDash([]);}
 // Recorte del video correspondiente a la guía, ya enderezado según el giro de la capa.
 function recorte(g,N){const M=vmap(),sb=aPant(g),sx=(sb.x-M.ox)/M.s,sy=(sb.y-M.oy)/M.s,sw=sb.w/M.s,sh=sb.h/M.s,k=N?N/(rot?sh:sw):Math.min(1,1600/(rot?sh:sw));const c=document.createElement('canvas');

  c.width=Math.round(sh*k);c.height=Math.round(sw*k);const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(rot===90?-Math.PI/2:Math.PI/2);x.drawImage(video,sx,sy,sw,sh,-sw*k/2,-sh*k/2,sw*k,sh*k);return c;}
 function medir(g){const c=recorte(g,160),w=c.width,h=c.height,D=c.getContext('2d').getImageData(0,0,w,h).data,Y=new Float32Array(w*h);let s=0,sat=0;for(let i=0,q=0;i<D.length;i+=4,q++){const y=.299*D[i]+.587*D[i+1]+.114*D[i+2];Y[q]=y;s+=y;if(y>248)sat++;}

  return {media:s/(w*h),sat:sat/(w*h),lap:l/n,bordes:e/n,lados:p.g==='tarjeta'?[bd(1,b,4,w-4,1),bd(h-b,h-1,4,w-4,1),bd(4,h-4,1,b,0),bd(4,h-4,w-b,w-1,0)].filter(x=>x>.05).length:0};}
 function tick(){if(pausa){loop=requestAnimationFrame(tick);return;}girar();const M=vmap();if(!M){loop=requestAnimationFrame(tick);return;}const {W,H}=dimOv(),g=caja(p,W,H),oriOk=p.o==='h'?fisH():!fisH();

// La foto queda registrada de inmediato (estado y miniatura); la imagen completa y el GPS se guardan después sin bloquear.
const FOTOMEM={};
async function guardarFoto(p,c,url,val){const v=VA();FOTOMEM[v.id+'_'+p.id]=url;let mini=null;try{const m=document.createElement('canvas'),k=120/Math.max(c.width,c.height);m.width=Math.round(c.width*k);m.height=Math.round(c.height*k);m.getContext('2d').drawImage(c,0,0,m.width,m.height);mini=m.toDataURL('image/jpeg',.6);}catch(e){}

// ====== Lectura en el celular (la confirma el motor de extracción de SIRIUS) ======
let ocrW=null;async function wk(){if(!window.Tesseract)await carga('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');if(!ocrW)ocrW=await Tesseract.createWorker('eng');return ocrW;}
async function leer(p,c){const v=VA();try{const w=await wk();await w.setParameters({tessedit_pageseg_mode:p.ocr==='matricula'?'6':'11'});const r=await w.recognize(c),T=(r.data.text||'').toUpperCase().replace(/\s+/g,' '),conf=Math.round(r.data.confidence||0);
 const put=(k,val)=>{if(!val)return;v.lect[k]={valor:val,conf,paso:p.n};if(v.form&&v.form[k]&&!v.form[k].valor)v.form[k]={valor:val,org:'Foto «'+p.n+'»',conf};};
 if(p.ocr==='placa'||p.ocr==='matricula'){const m=T.match(/\b([A-Z]{2,3})[- ]?(\d{3,4}[A-Z]?)\b/);if(m)put('placa',m[1]+m[2]);}

// ====== Opciones de prueba ======
function prueba(){const v=VA();if(MODO==='prueba')return '<details class="prueba"><summary>Modo prueba · conectado a SIRIUS</summary><div class="r"><button onclick="cargarDatos()">Actualizar desde SIRIUS</button>'+(S.p==='visita'&&v&&v.st==='pend'?'<button onclick="aqui()">Poner esta visita en mi ubicación</button>':'')+(S.p==='visita'&&v&&v.st==='cur'?'<button onclick="completarFotos()">Completar las fotos con imágenes de prueba</button>':'')+''+(S.p==='visita'&&v&&(v.st==='env'||v.st==='cur')?'<button onclick="reenviarFotos()">Reenviar las fotos reales al servidor</button>':'')+'<button onclick="SB.auth.signOut().then(()=>{localStorage.removeItem(CLAVE);location.reload()})">Cerrar sesión</button></div><p class="mut sm">'+(YO?YO.email:'')+'</p></details>';
